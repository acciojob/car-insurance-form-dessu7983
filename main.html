<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Insurance Registration Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .container {
            width: 400px;
            margin: 40px auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
        }

        .gender-group input {
            width: auto;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 10px;
            background-color: green;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: darkgreen;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Car Insurance Registration Form</h2>

    <form method="post">

        <!-- Name -->
        <label for="name">Name</label>
        <input type="text" id="name" required>

        <!-- Email -->
        <label for="email">Email</label>
        <input type="email" id="email" required>

        <!-- Gender -->
        <label>Gender</label>
        <div class="gender-group">
            <input type="radio" id="male" name="gender" required>
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" required>
            <label for="female">Female</label>
        </div>

        <!-- Car Brands -->
        <label for="cars">Car Brands</label>
        <select id="cars">
            <option value="BMW">BMW</option>
            <option value="Audi">Audi</option>
            <option value="Mercedez">Mercedez</option>
        </select>

        <!-- Car Age -->
        <label for="carage">Car Age</label>
        <input type="number" id="carage" required>

        <!-- Date of Purchase -->
        <label for="dop">Date of Purchase</label>
        <input type="date" id="dop" required>

        <!-- Password -->
        <label for="password">Password</label>
        <input type="password" id="password" required>

        <!-- Submit Button -->
        <button type="submit">Submit</button>

    </form>
</div>

</body>
</html>
